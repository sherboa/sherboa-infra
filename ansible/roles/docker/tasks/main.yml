---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: "{{ docker_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ docker_apt_cache_valid_time }}"

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker repository GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    mode: "0644"

- name: Configure Docker APT repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: "{{ docker_apt_repository_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update Docker APT package cache

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
