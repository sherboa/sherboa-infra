---
# Docker repository configuration
docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_repository_file: /etc/apt/sources.list.d/docker.sources

# Docker packages
docker_prerequisite_packages:
  - ca-certificates
  - curl

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# APT cache
docker_apt_cache_valid_time: 3600
