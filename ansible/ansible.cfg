[defaults]
# Inventory
inventory = ./inventory/hosts.yml

# Ansible project paths
roles_path = ./roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Remote execution
remote_user = ubuntu
interpreter_python = auto_silent

# Connection behavior
host_key_checking = True
timeout = 30
forks = 5

# Output
display_skipped_hosts = False
deprecation_warnings = True

[ssh_connection]
# SSH transport through AWS Systems Manager
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region us-east-1"

# Conservative initial configuration
pipelining = False
