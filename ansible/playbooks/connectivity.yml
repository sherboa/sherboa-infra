---
# Sherboa Infrastructure
# Playbook: Connectivity verification

- name: Verify Sherboa infrastructure connectivity
  hosts: sherboa
  gather_facts: true

  tasks:
    - name: Verify Ansible connectivity
      ansible.builtin.ping:

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "Inventory host: {{ inventory_hostname }}"
          - "Hostname: {{ ansible_facts.hostname }}"
          - "OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
          - "Architecture: {{ ansible_facts.architecture }}"
          - "Python: {{ ansible_facts.python.executable }}"
