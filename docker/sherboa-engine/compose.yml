
services:
  sherboa-engine:
    image: 557643338880.dkr.ecr.us-east-1.amazonaws.com/sherboa-engine:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sherboa-engine
    restart: unless-stopped

    user: "10001:10001"

    environment:
      SHERBOA_USAGE_DB_PATH: /data/usage.db

    volumes:
      - /srv/sherboa-data:/data

    networks:
      - sherboa-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  sherboa-network:
    external: true
    name: sherboa-network

